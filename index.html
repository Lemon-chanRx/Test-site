<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seagull Dancing by the Seaside</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <div class="sun"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="bird far bird-1"></div>
    <div class="bird far bird-2"></div>

    <div class="sea">
      <div class="wave wave-1"></div>
      <div class="wave wave-2"></div>
      <div class="wave wave-3"></div>
    </div>

    <div class="sand">
      <div class="shell shell-1"></div>
      <div class="shell shell-2"></div>
      <div class="starfish"></div>
    </div>

    <div class="seagull">
      <div class="shadow"></div>
      <div class="body">
        <div class="tail"></div>
        <div class="wing wing-left">
          <div class="feather f1"></div>
          <div class="feather f2"></div>
          <div class="feather f3"></div>
        </div>
        <div class="wing wing-right">
          <div class="feather f1"></div>
          <div class="feather f2"></div>
          <div class="feather f3"></div>
        </div>
        <div class="head">
          <div class="eye"></div>
          <div class="beak"></div>
        </div>
        <div class="leg leg-left">
          <div class="foot"></div>
        </div>
        <div class="leg leg-right">
          <div class="foot"></div>
        </div>
      </div>
    </div>

    <h1 class="title">A Seagull Dancing by the Seaside</h1>

    <a class="play-link" href="game.html">▶ Play Seagull Snack Attack</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
